<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پنل مدیریت 10X</title>
<style>
:root{--bg:#f4f5f8;--card:#fff;--ink:#1b1f2a;--mut:#6b7280;--line:#e5e7eb;--pri:#4f46e5;--ok:#16a34a;--bad:#dc2626;--warn:#d97706}
@media(prefers-color-scheme:dark){:root{--bg:#0f1117;--card:#181b24;--ink:#e8eaf0;--mut:#9aa1b2;--line:#2a2f3c;--pri:#818cf8;--ok:#4ade80;--bad:#f87171;--warn:#fbbf24}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.7 Vazirmatn,Tahoma,sans-serif}
.hide{display:none!important}.center{min-height:100vh;display:grid;place-items:center;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
input,select,textarea,button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
button{cursor:pointer;background:var(--pri);color:#fff;border:0}button.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}button.bad{background:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>input,.row>select{flex:1;min-width:140px}
#app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
aside{background:var(--card);border-inline-end:1px solid var(--line);padding:16px 10px;position:sticky;top:0;height:100vh}
aside h2{margin:0 8px 14px;font-size:17px;color:var(--pri)}
aside a{display:block;padding:9px 12px;border-radius:8px;color:var(--ink);cursor:pointer;margin-bottom:2px}
aside a.on{background:var(--pri);color:#fff}aside a:hover:not(.on){background:var(--bg)}
main{padding:20px;min-width:0}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:8px}
header h1{margin:0;font-size:20px}.mut{color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.stat b{display:block;font-size:28px}.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse}th,td{text-align:start;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mut);font-weight:500}tbody tr.cl:hover{background:var(--bg);cursor:pointer}
.tag{padding:2px 8px;border-radius:99px;font-size:12px;background:var(--bg);border:1px solid var(--line)}
.tag.ok{color:var(--ok)}.tag.bad{color:var(--bad)}.tag.warn{color:var(--warn)}
.bar{height:10px;border-radius:5px;background:var(--pri);min-width:3px}.f{display:grid;grid-template-columns:150px 1fr 40px;gap:10px;align-items:center;margin:6px 0}
.two{display:grid;grid-template-columns:320px 1fr;gap:12px}.msgs{max-height:55vh;overflow:auto;display:flex;flex-direction:column;gap:8px;margin:12px 0}
.m{padding:8px 12px;border-radius:10px;background:var(--bg);max-width:85%}.m.ADMIN{background:var(--pri);color:#fff;align-self:flex-start}.m.USER{align-self:flex-end}.m.SYSTEM{align-self:center;color:var(--mut);font-size:12px}
.ti{padding:10px;border-bottom:1px solid var(--line);cursor:pointer}.ti.on,.ti:hover{background:var(--bg)}
#drawer{position:fixed;inset:0;background:#0006;display:flex;justify-content:flex-start;z-index:9}#drawer .card{width:min(420px,100%);height:100%;border-radius:0;overflow:auto}
dl{display:grid;grid-template-columns:130px 1fr;gap:6px 10px}dt{color:var(--mut)}dd{margin:0;word-break:break-all}
#toast{position:fixed;bottom:16px;inset-inline-start:16px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:10}
@media(max-width:800px){#app{grid-template-columns:1fr}aside{position:static;height:auto;display:flex;overflow-x:auto;gap:4px;padding:8px}aside h2{display:none}aside a{white-space:nowrap;margin:0}.two{grid-template-columns:1fr}}

/* STANDALONE PAGE EDITOR */
body.tenx-editor-standalone #app {
  display: block;
  min-height: 100vh;
}

}
body.tenx-editor-standalone #app > main {

}
body.tenx-editor-standalone #drawer {
  z-index: 20;
}
</style>

<div id="login" class="center"><div class="card" style="width:min(380px,100%)"><h2 style="margin-top:0">ورود به پنل 10X</h2>
<div class="row" style="flex-direction:column;align-items:stretch"><input id="em" type="email" placeholder="ایمیل" autocomplete="username"><input id="pw" type="password" placeholder="رمز عبور" autocomplete="current-password"><button id="go">ورود</button></div>

<p id="lerr" class="mut"></p></div></div>
<div id="app" class="hide"><aside><h2>10X</h2><nav id="nav"></nav></aside>
<main><header><h1 id="title"></h1><div class="row"><span class="mut" id="who"></span><button class="sec" id="out">خروج</button></div></header><div id="view"></div></main></div>
<div id="drawer" class="hide"></div><div id="toast" class="hide"></div>
<script>
const $=s=>document.querySelector(s);
const h=(t,p,...k)=>{const e=document.createElement(t);for(const[a,v]of Object.entries(p||{})){if(a==='class')e.className=v;else if(a.startsWith('on'))e[a]=v;else if(v!=null)e.setAttribute(a,v)}for(const c of k.flat())if(c!=null&&c!==false)e.append(c.nodeType?c:String(c));return e};
let token='',me=null,cur='overview';try{token=sessionStorage.getItem('tenx_admin_token')||''}catch(e){}
const fa=d=>d?new Date(d).toLocaleString('fa-IR'):'—';
const toast=(m)=>{const t=$('#toast');t.textContent=m;t.classList.remove('hide');setTimeout(()=>t.classList.add('hide'),3500)};
async function api(p,o={}){const r=await fetch('/admin'+p,{...o,headers:{'content-type':'application/json',authorization:'Bearer '+token}});const d=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(d.message||d.error||('HTTP '+r.status));e.status=r.status;throw e}return d}
const MENU=[['overview','نمای کلی',null],['bot','مدیریت ربات',['SUPER_ADMIN']],['users','کاربران',['USER_MANAGER','SUPPORT','ANALYST','MARKETING_MANAGER']],['tickets','پشتیبانی',['SUPPORT','USER_MANAGER']],['outreach','پیگیری و اعلان',['MARKETING_MANAGER','USER_MANAGER']],['academy','آکادمی',['ACADEMY_MANAGER','ANALYST']],['progress','مسیر پیشرفت',['SUPER_ADMIN']],['pages','صفحه‌ها و پاپ‌آپ',['CONTENT_MANAGER','ANALYST']],['organizers','برگزارکنندگان چالش',['CONTENT_MANAGER']],['homeLinks','لینک‌های صفحه اصلی',['CONTENT_MANAGER','ANALYST']],['audit','گزارش فعالیت',[]],['admins','مدیران و نقش‌ها',[]],['bottomNav','نوار پایین Mini App',['SUPER_ADMIN','CONTENT_MANAGER']],['settings','تنظیمات',[]]];
const ok=m=>me.role==='SUPER_ADMIN'||m[2]===null||m[2].includes(me.role);
const ROLES=['SUPER_ADMIN','USER_MANAGER','SUPPORT','CONTENT_MANAGER','ACADEMY_MANAGER','CHALLENGE_MANAGER','ANALYST','MARKETING_MANAGER'];
function table(cols,rows,onrow){return h('div',{class:'tbl'},h('table',{},h('thead',{},h('tr',{},cols.map(c=>h('th',{},c[0])))),h('tbody',{},rows.map(r=>h('tr',{class:onrow?'cl':'',onclick:onrow?()=>onrow(r):null},cols.map(c=>h('td',{},c[1](r))))))))}
function generic(items){if(!items.length)return h('p',{class:'mut'},'موردی ثبت نشده است.');const ks=Object.keys(items[0]);return table(ks.map(k=>[k,r=>typeof r[k]==='object'&&r[k]?JSON.stringify(r[k]):String(r[k]??'—')]),items)}
async function boot(){
try{me=await api('/auth/me')}catch(e){$('#lerr').textContent=e.message;return}
$('#login').classList.add('hide');
$('#app').classList.remove('hide');
$('#who').textContent=me.email+' · '+me.role;

const editorMatch=location.pathname.match(/^\/admin\/editor\/([^/]+)$/);
if(editorMatch){
  let slug='';
  try{slug=decodeURIComponent(editorMatch[1])}catch(e){}
  if(!SLUGS.includes(slug)){
    $('#view').textContent='صفحه نامعتبر است.';
    return;
  }
  if(!['SUPER_ADMIN','CONTENT_MANAGER'].includes(me.role)){
    $('#view').textContent='دسترسی به ویرایشگر ندارید.';
    return;
  }
  document.body.classList.add('tenx-editor-standalone');
  $('#nav').replaceChildren();
  $('#title').textContent='ویرایشگر صفحه · '+slug;
  $('#view').textContent='در حال بارگذاری ویرایشگر…';
  try{
    const data=await api('/content/pages/'+encodeURIComponent(slug)+'/editor');
    editPage(data);
  }catch(e){
    $('#view').replaceChildren(h('div',{class:'card'},'خطا در بارگذاری صفحه: '+e.message));
  }
  return;
}

$('#nav').replaceChildren(...MENU.filter(ok).map(m=>h('a',{id:'n-'+m[0],onclick:()=>show(m[0])},m[1])));
show(MENU.filter(ok)[0][0]);
}
async function show(id){cur=id;document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.id==='n-'+id));$('#title').textContent=MENU.find(m=>m[0]===id)[1];const botPanel=$('#tenx-real-bot-manager');if(botPanel)botPanel.classList.toggle('hide',id!=='bot');if(id==='bot'){const v=$('#view');v.replaceChildren();window.tenxBotStatus?.();return}const v=$('#view');v.replaceChildren(h('p',{class:'mut'},'در حال بارگذاری…'));try{v.replaceChildren(await VIEWS[id]())}catch(e){v.replaceChildren(h('div',{class:'card'},h('b',{class:'tag bad'},'خطا'),' ',e.message))}}
const STAGES={};
const VIEWS={
async overview(){const s=await api('/summary');const box=h('div',{});box.append(h('div',{class:'grid'},[['کل کاربران',s.totalUsers],['ثبت‌نام کامل',s.registeredUsers],['ثبت‌نام ناقص',s.incompleteRegistrations],['جدید در ۲۴ ساعت',s.newLast24Hours]].map(x=>h('div',{class:'card stat'},h('span',{class:'mut'},x[0]),h('b',{},String(x[1]??0))))));
try{const u=await api('/users?limit=200');const c={};u.items.forEach(x=>c[x.registrationStage||'—']=(c[x.registrationStage||'—']||0)+1);const mx=Math.max(1,...Object.values(c));box.append(h('div',{class:'card'},h('b',{},'قیف ثبت‌نام (بر اساس مرحله)'),Object.entries(c).map(([k,n])=>h('div',{class:'f'},h('span',{},k),h('div',{class:'bar',style:'width:'+(n/mx*100)+'%'}),h('span',{},String(n))))))}catch(e){}
try{const a=await api('/audit-logs?limit=8');box.append(h('div',{class:'card',style:'margin-top:12px'},h('b',{},'آخرین فعالیت‌ها'),table([['زمان',r=>fa(r.createdAt)],['عمل',r=>r.action]],a.items.slice(0,8))))}catch(e){}
return box},

async bottomNav(){
  const wrap=h('div',{});
  let items=[];

  const field=(label,value,oninput,placeholder='')=>{
    const box=h('label',{style:'display:flex;flex-direction:column;gap:6px;flex:1;min-width:130px'});
    box.append(h('span',{class:'mut'},label));
    const input=h('input',{value:value??'',placeholder});
    input.addEventListener('input',()=>oninput(input.value));
    box.append(input);
    return box;
  };

  async function load(){
    const d=await api('/bottom-nav');
    items=(d.items||[]).map(x=>({...x}));
    draw();
  }

  function draw(){
    wrap.replaceChildren();

    wrap.append(
      h('div',{class:'card'},
        h('b',{},'مدیریت نوار پایین Mini App'),
        h('p',{class:'mut'},
          'آیتم‌ها در نوار پایین کاربران نمایش داده می‌شوند. ترتیب با دکمه‌های بالا و پایین قابل تغییر است. حداکثر ۸ آیتم.'
        ),
        h('div',{class:'row'},
          h('button',{onclick:addItem},'+ افزودن آیتم'),
          h('button',{class:'sec',onclick:load},'بارگذاری مجدد')
        )
      )
    );

    if(!items.length){
      wrap.append(h('div',{class:'card mut'},'هیچ آیتمی وجود ندارد. برای شروع یک آیتم اضافه کن.'));
    }

    items.forEach((item,index)=>{
      const card=h('div',{class:'card',style:'margin-top:10px'});
      const enabled=h('input',{type:'checkbox',checked:item.enabled});
      enabled.addEventListener('change',()=>{item.enabled=enabled.checked});

      const row=h('div',{class:'row',style:'justify-content:space-between;align-items:center'});
      row.append(
        h('b',{},(index+1)+'. '+item.label),
        h('span',{class:'tag'},item.enabled?'فعال':'غیرفعال')
      );

      card.append(row);

      const fields=h('div',{class:'row',style:'flex-wrap:wrap;margin-top:12px'});
      fields.append(
        field('عنوان',item.label,v=>item.label=v,'مثلاً خانه'),
        field('مسیر داخلی',item.href,v=>item.href=v,'مثلاً /academy'),
        field('آیکون',item.icon,v=>item.icon=v,'home / academy / support')
      );

      card.append(fields);

      const controls=h('div',{class:'row',style:'margin-top:12px;flex-wrap:wrap'});
      controls.append(
        h('label',{class:'row',style:'gap:7px;align-items:center'},enabled,'نمایش آیتم'),
        h('button',{class:'sec',disabled:index===0,onclick:()=>move(index,-1)},'بالا'),
        h('button',{class:'sec',disabled:index===items.length-1,onclick:()=>move(index,1)},'پایین'),
        h('button',{class:'bad',onclick:()=>removeItem(index)},'حذف')
      );
      card.append(controls);
      wrap.append(card);
    });

    wrap.append(
      h('div',{class:'card',style:'margin-top:12px'},
        h('button',{onclick:save},'ذخیره نوار پایین')
      )
    );
  }

  function addItem(){
    if(items.length>=8){toast('حداکثر ۸ آیتم مجاز است.');return}
    items.push({
      id:'nav-'+Date.now().toString(36),
      label:'آیتم جدید',
      href:'/miniapp',
      icon:'star',
      enabled:true,
      sort:(items.length+1)*10
    });
    draw();
  }

  function removeItem(index){
    if(!confirm('این آیتم از نوار پایین حذف شود؟'))return;
    items.splice(index,1);
    draw();
  }

  function move(index,delta){
    const target=index+delta;
    if(target<0||target>=items.length)return;
    const temp=items[index];
    items[index]=items[target];
    items[target]=temp;
    items.forEach((item,i)=>item.sort=(i+1)*10);
    draw();
  }

  async function save(){
    try{
      const payload={
        items:items.map((item,index)=>({
          id:String(item.id),
          label:String(item.label).trim(),
          href:String(item.href).trim(),
          icon:String(item.icon).trim(),
          enabled:Boolean(item.enabled),
          sort:(index+1)*10
        }))
      };
      await api('/bottom-nav',{
        method:'PUT',
        body:JSON.stringify(payload)
      });
      toast('نوار پایین با موفقیت ذخیره شد.');
      await load();
    }catch(e){
      toast('ذخیره انجام نشد: '+e.message);
    }
  }

  await load();
  return wrap;
},

async users(){
let items=[],cursor=null,total=0;
const wrap=h('div',{}),tb=h('div',{}),more=h('button',{class:'sec',onclick:()=>load()},'بارگذاری بیشتر');
const q=h('input',{placeholder:'جستجو: نام، یوزرنیم، تلفن یا شناسه'});
const st=h('select',{},h('option',{value:''},'همه وضعیت‌ها'),
  ...['STARTED','REGISTERED','COMPLETE'].map(x=>h('option',{value:x},x)));
const stage=h('select',{},h('option',{value:''},'همه مراحل'),
  ...['STARTED','CHANNELS_PENDING','CONSENT_PENDING','PHONE_PENDING','REGISTERED','MINI_APP_PENDING','COMPLETE'].map(x=>h('option',{value:x},x)));
function draw(){
  tb.replaceChildren(
    h('p',{class:'mut'},'نمایش '+items.length+' نفر از '+total+' کاربر'),
    table([
      ['نام',u=>[u.firstName,u.lastName].filter(Boolean).join(' ')||'—'],
      ['یوزرنیم',u=>u.username?'@'+u.username:'—'],
      ['تلفن',u=>u.phone||'—'],
      ['وضعیت',u=>h('span',{class:'tag '+(u.registrationStatus==='REGISTERED'?'ok':'warn')},u.registrationStatus||'—')],
      ['مرحله',u=>u.registrationStage||'—'],
      ['آخرین فعالیت',u=>fa(u.lastActivityAt)]
    ],items,drawer)
  );
  more.classList.toggle('hide',!cursor);
  more.disabled=!cursor;
}
async function load(reset=false){
  if(reset){items=[];cursor=null}
  const params=new URLSearchParams({limit:'50'});
  if(q.value.trim())params.set('q',q.value.trim());
  if(st.value)params.set('status',st.value);
  if(stage.value)params.set('stage',stage.value);
  if(cursor)params.set('cursor',cursor);
  const d=await api('/users?'+params.toString());
  items=reset?d.items:items.concat(d.items);
  total=d.total??items.length;
  cursor=d.nextCursor||null;
  draw();
}
const search=h('button',{onclick:()=>load(true)},'جستجو');

async progress(){
  if(me.role!=='SUPER_ADMIN'){
    return h('div',{class:'card'},'دسترسی غیرمجاز');
  }

  const box=h('div',{});
  let versions=[];

  const statusLabel=s=>({
    DRAFT:'پیش‌نویس',
    PUBLISHED:'منتشرشده',
    ARCHIVED:'بایگانی‌شده'
  }[s]||s);

  const statusTag=s=>h('span',{
    class:'tag '+(s==='PUBLISHED'?'ok':s==='DRAFT'?'warn':'')
  },statusLabel(s));

  const request=async(path,options)=>{
    try{return await api(path,options);}
    catch(e){
      toast('خطا: '+e.message);
      throw e;
    }
  };

  async function load(){
    const d=await request('/progress');
    versions=d.items||[];
    draw();
  }

  function draw(){
    box.replaceChildren();

    const header=h('div',{class:'card',style:'margin-bottom:12px'},
      h('div',{class:'row',style:'justify-content:space-between'},
        h('b',{},'مدیریت مسیر پیشرفت 10X'),
        h('button',{onclick:createDraft},'+ ساخت پیش‌نویس')
      ),
      h('p',{class:'mut'},
        'مسیر منتشرشده در Mini App استفاده می‌شود. تغییرات ابتدا در پیش‌نویس انجام می‌شوند.'
      )
    );

    box.append(header);

    if(!versions.length){
      box.append(h('div',{class:'card mut'},'هنوز مسیری ساخته نشده است.'));
      return;
    }

    versions.forEach(v=>{
      const active=v.status==='DRAFT';
      const stages=(v.stages||[]);
      const activeStages=stages.filter(x=>x.isActive!==false);
      const card=h('div',{class:'card',style:'margin-bottom:14px'});

      card.append(
        h('div',{class:'row',style:'justify-content:space-between'},
          h('b',{},'مسیر نسخه '+v.version+' · '+(v.title||'مسیر پیشرفت')),
          statusTag(v.status)
        ),
        h('p',{class:'mut'},
          'شناسه: '+v.id
        ),
        h('p',{class:'mut'},
          'مراحل فعال: '+activeStages.length+' · آرشیوشده: '+(stages.length-activeStages.length)+
          ' · تخصیص کاربران: '+(v._count?.assignments??0)
        )
      );

      if(v.status!=='DRAFT'){
        card.append(
          h('button',{
            class:'sec',
            style:'margin-bottom:10px',
            onclick:()=>editVersion(v)
          },'ویرایش این نسخه')
        );
      }

      if(v.description){
        card.append(h('p',{},v.description));
      }

      if(active){
        card.append(
          h('button',{onclick:()=>createStage(v)},'+ افزودن مرحله')
        );
      }

      if(!stages.length){
        card.append(h('p',{class:'mut'},'هنوز مرحله‌ای تعریف نشده است.'));
      }

      stages.forEach((stage,index)=>{
        const item=h('div',{
          class:'card',
          style:'margin-top:10px;padding:12px'
        });

        item.append(
          h('div',{class:'row',style:'justify-content:space-between'},
            h('b',{},(index+1)+'. '+stage.title),
            h('div',{class:'row'},
              h('span',{class:'tag'},'وزن: '+stage.weight),
              stage.isActive===false
                ? h('span',{class:'tag'},'آرشیوشده')
                : h('span',{class:'tag ok'},'فعال')
            )
          ),
          h('p',{class:'mut'},
            'Key: '+stage.key+
            ' · ترتیب: '+stage.sortOrder+
            ' · نوع: '+stage.completionType
          ),
          h('p',{class:'mut'},
            'شناسه مرحله: '+stage.id
          ),
          h('p',{},stage.description||'بدون توضیحات'),
          h('p',{class:'mut'},
            'نمایش: '+(stage.isVisible?'بله':'خیر')+
            ' · پیش‌نیازها: '+
            ((stage.prerequisiteIds||[]).join(', ')||'ندارد')
          )
        );

        if(active && stage.isActive!==false){
          item.append(
            h('div',{class:'row'},
              h('button',{
                class:'sec',
                onclick:()=>editStage(v,stage)
              },'ویرایش'),
              h('button',{
                class:'bad',
                onclick:()=>archiveStage(stage)
              },'آرشیو')
            )
          );
        }

        card.append(item);
      });

      if(active){
        card.append(
          h('div',{class:'row',style:'margin-top:14px'},
            h('button',{
              onclick:()=>publish(v),
              style:'background:var(--ok)'
            },'انتشار این مسیر')
          )
        );
      }

      box.append(card);
    });
  }

  async function editVersion(v){
    if(v.status==='DRAFT')return;

    const confirmed=confirm(
      'یک پیش‌نویس مستقل از نسخه '+v.version+
      ' ساخته شود؟ نسخه اصلی و پیشرفت کاربران تغییر نمی‌کند.'
    );

    if(!confirmed)return;

    try{
      const d=await request('/progress/draft',{
        method:'POST',
        body:JSON.stringify({sourceVersionId:v.id})
      });

      toast(
        'پیش‌نویس آماده شد؛ '+
        (d.clonedStageCount??0)+' مرحله کپی شد.'
      );

      await load();
    }catch(e){
      if(e.message&&e.message.includes('409')){
        toast('یک پیش‌نویس دارای مرحله وجود دارد؛ ابتدا آن را تعیین تکلیف کنید.');
      }
    }
  }

  async function createDraft(){
    if(!confirm('پیش‌نویس مسیر جدید ساخته شود؟'))return;

    try{
      const d=await request('/progress/draft',{
        method:'POST',
        body:JSON.stringify({})
      });

      toast(d.reused?'پیش‌نویس موجود بازیابی شد.':'پیش‌نویس ساخته شد.');
      await load();
    }catch(e){}
  }

  async function readStage(existing,version){
    const ask=(label,value)=>{
      const result=prompt(label,value==null?'':String(value));
      return result===null?null:result;
    };

    const key=ask('شناسه یکتای مرحله (key):',existing?.key||'');
    if(key===null)return null;

    const title=ask('عنوان مرحله:',existing?.title||'');
    if(title===null)return null;

    const description=ask('توضیحات مرحله:',existing?.description||'');
    if(description===null)return null;

    const weightText=ask('امتیاز مرحله (۱ تا ۱٬۰۰۰٬۰۰۰):',existing?.weight??1);
    if(weightText===null)return null;

    const orderText=ask('ترتیب نمایش:',existing?.sortOrder??0);
    if(orderText===null)return null;

    const type=ask(
      'نوع تکمیل: MANUAL یا REGISTRATION_STAGE یا ACADEMY_LESSON',
      existing?.completionType||'MANUAL'
    );
    if(type===null)return null;

    const visibleText=ask(
      'نمایش مرحله؟ yes یا no',
      existing?.isVisible===false?'no':'yes'
    );
    if(visibleText===null)return null;

    const oldPrereq=(existing?.prerequisiteIds||[]).join(',');
    const prereqText=ask(
      'شناسه مراحل پیش‌نیاز را با کاما جدا کن:',
      oldPrereq
    );
    if(prereqText===null)return null;

    const actionType=ask(
      'نوع اقدام (اختیاری):',
      existing?.actionType||''
    );
    if(actionType===null)return null;

    const actionTarget=ask(
      'لینک اقدام (اختیاری):',
      existing?.actionTarget||''
    );
    if(actionTarget===null)return null;

    let completionConfig={};

    if(type.trim()==='REGISTRATION_STAGE'){
      const targets=[
        'STARTED',
        'CHANNELS_PENDING',
        'CONSENT_PENDING',
        'PHONE_PENDING',
        'REGISTERED',
        'MINI_APP_PENDING',
        'COMPLETE'
      ];

      const targetStage=ask(
        'مرحله ثبت‌نام موردنیاز:\n'+targets.join('\n'),
        existing?.completionConfig?.targetStage||'REGISTERED'
      );
      if(targetStage===null)return null;

      if(!targets.includes(targetStage.trim())){
        toast('targetStage نامعتبر است. یکی از مقادیر نمایش‌داده‌شده را وارد کن.');
        return null;
      }

      completionConfig={targetStage:targetStage.trim()};
    }else if(type.trim()==='ACADEMY_LESSON'){
      try{
        const catalog=await request('/progress/activities');
        const activities=catalog.items||[];
        const currentId=existing?.completionConfig?.lessonId||'';

        if(currentId&&!activities.some(x=>x.id===currentId)){
          activities.unshift({
            id:currentId,
            title:'درس فعلی (غیرمنتشر)',
            courseTitle:'—'
          });
        }

        if(!activities.length){
          toast('هیچ درس منتشرشده‌ای در آکادمی وجود ندارد.');
          return null;
        }

        const choices=activities.map(x=>
          x.title+' — '+x.courseTitle+' — '+x.id
        ).join('\n');

        const lessonId=ask(
          'شناسه درس موردنظر را از فهرست زیر وارد کن:\n'+choices,
          currentId||activities[0].id
        );

        if(lessonId===null)return null;

        if(!activities.some(x=>x.id===lessonId.trim())){
          toast('شناسه درس در فهرست آکادمی وجود ندارد.');
          return null;
        }

        completionConfig={lessonId:lessonId.trim()};
      }catch(e){
        toast(e.message||'دریافت فهرست درس‌ها ناموفق بود.');
        return null;
      }
    }else{
      const configText=ask(
        'completionConfig به صورت JSON:',
        JSON.stringify(existing?.completionConfig||{},null,2)
      );
      if(configText===null)return null;

      try{
        completionConfig=JSON.parse(configText||'{}');
        if(!completionConfig||Array.isArray(completionConfig)||typeof completionConfig!=='object'){
          throw new Error();
        }
      }catch(e){
        toast('completionConfig باید یک JSON object معتبر باشد.');
        return null;
      }
    }

    const weight=Number(weightText);
    const sortOrder=Number(orderText);

    if(!Number.isInteger(weight)||weight<1||weight>1000000){
      toast('امتیاز باید عدد صحیح بین ۱ تا ۱٬۰۰۰٬۰۰۰ باشد.');
      return null;
    }

    if(!Number.isInteger(sortOrder)||sortOrder<0){
      toast('ترتیب نمایش نامعتبر است.');
      return null;
    }

    if(!/^[a-zA-Z0-9_-]{1,80}$/.test(key.trim())){
      toast('شناسه مرحله فقط می‌تواند شامل حروف، اعداد، خط تیره و زیرخط باشد.');
      return null;
    }

    if(!title.trim()){
      toast('عنوان مرحله الزامی است.');
      return null;
    }

    if(!['MANUAL','REGISTRATION_STAGE','ACADEMY_LESSON'].includes(type.trim())){
      toast('نوع تکمیل نامعتبر است.');
      return null;
    }

    const prerequisiteIds=prereqText.split(',')
      .map(x=>x.trim()).filter(Boolean);

    if(new Set(prerequisiteIds).size!==prerequisiteIds.length){
      toast('پیش‌نیاز تکراری وارد شده است.');
      return null;
    }

    return {
      ...(existing?{}:{pathVersionId:version.id}),
      key:key.trim(),
      title:title.trim(),
      description:description.trim()||null,
      weight,
      sortOrder,
      completionType:type.trim(),
      isVisible:!['no','false','0'].includes(visibleText.trim().toLowerCase()),
      prerequisiteIds,
      completionConfig,
      actionType:actionType.trim()||null,
      actionTarget:actionTarget.trim()||null
    };
  }

  async function createStage(v){
    let payload;
    try{
      payload=await readStage(null,v);
    }catch(e){
      toast(e.message||'خطا در دریافت اطلاعات مرحله.');
      return;
    }
    if(!payload)return;

    try{
      await request('/progress/stages',{
        method:'POST',
        body:JSON.stringify(payload)
      });
      toast('مرحله ساخته شد.');
      await load();
    }catch(e){}
  }

  async function editStage(v,stage){
    let payload;
    try{
      payload=await readStage(stage,v);
    }catch(e){
      toast(e.message||'خطا در دریافت اطلاعات مرحله.');
      return;
    }
    if(!payload)return;

    try{
      await request('/progress/stages/'+encodeURIComponent(stage.id),{
        method:'PATCH',
        body:JSON.stringify(payload)
      });
      toast('مرحله ویرایش شد.');
      await load();
    }catch(e){}
  }

  async function archiveStage(stage){
    if(!confirm('این مرحله آرشیو شود؟ این عملیات حذف دائمی نیست.'))return;

    try{
      await request('/progress/stages/'+encodeURIComponent(stage.id),{
        method:'DELETE'
      });
      toast('مرحله آرشیو شد.');
      await load();
    }catch(e){}
  }

  async function publish(v){
    const active=(v.stages||[]).filter(x=>x.isActive!==false);

    if(!active.length){
      toast('برای انتشار حداقل یک مرحله فعال لازم است.');
      return;
    }

    const total=active.reduce((sum,x)=>sum+Number(x.weight||0),0);

    if(!confirm(
      'مسیر نسخه '+v.version+' منتشر شود؟\n'+
      'تعداد مراحل: '+active.length+
      '\nمجموع امتیازها: '+total+
      '\nاعتبارسنجی نهایی توسط سرور انجام می‌شود.'
    ))return;

    try{
      const d=await request('/progress/publish',{
        method:'POST',
        body:JSON.stringify({versionId:v.id})
      });

      toast('مسیر نسخه '+d.version+' منتشر شد.');
      await load();
    }catch(e){}
  }

  try{
    await load();
  }catch(e){
    box.replaceChildren(
      h('div',{class:'card'},
        h('b',{class:'tag bad'},'خطا در دریافت مسیر پیشرفت'),
        h('p',{},e.message),
        h('button',{onclick:load},'تلاش مجدد')
      )
    );
  }

  return box;
},

    blocks.splice(0, blocks.length, ...state.blocks);
    selected = state.selected;
    drawInspector();
    drawStage();
    updateHistoryButtons();
  }

  function redoEdit() {
    if (!redoStack.length) return;
    undoStack.push(snapshotHistory());
    const state = redoStack.pop();
    blocks.splice(0, blocks.length, ...state.blocks);
    selected = state.selected;

  // وضعیت اولیه عناصر iframe برای بازگردانی پیش از هر رندر
  const previewSnapshots = new Map();

  function snapshotPreviewTarget(doc, target) {
    if (previewSnapshots.has(target)) return;

    const styleProps = [
      'color', 'background-color', 'font-size', 'font-weight',
      'border-radius', 'padding', 'margin', 'opacity',
      'line-height', 'letter-spacing', 'text-align', 'width',
      'max-width', 'min-height', 'border-color', 'border-width',
      'border-style', 'box-shadow'
    ];

    const snapshot = {
      parent: target.parentNode,
      nextSibling: target.nextSibling,
      textNodes: Array.from(target.childNodes).filter(n => n.nodeType === 3)
        .map(n => ({node:n, value:n.nodeValue})),
      createdText: null,
      attrs: {},
      styles: {}
    };

    ['href', 'src', 'alt'].forEach(name => {
      snapshot.attrs[name] = {
        exists: target.hasAttribute(name),
        value: target.getAttribute(name)
      };
    });

    styleProps.forEach(name => {
      snapshot.styles[name] = {
        value: target.style.getPropertyValue(name),
        priority: target.style.getPropertyPriority(name)
      };
    });

    previewSnapshots.set(target, snapshot);
  }

  function restorePreviewTargets() {
    previewSnapshots.forEach((snapshot, target) => {
      if (!target) return;

      if (!target.isConnected && snapshot.parent && snapshot.parent.isConnected) {
        snapshot.parent.insertBefore(
          target,
          snapshot.nextSibling && snapshot.nextSibling.parentNode === snapshot.parent
            ? snapshot.nextSibling
            : null
        );
      }

      snapshot.textNodes.forEach(item => {
        if (item.node.parentNode === target) item.node.nodeValue = item.value;
      });

      if (snapshot.createdText && snapshot.createdText.parentNode === target) {
        snapshot.createdText.remove();
      }

      Object.entries(snapshot.attrs).forEach(([name, state]) => {
        if (state.exists) target.setAttribute(name, state.value);
        else target.removeAttribute(name);
      });

      Object.entries(snapshot.styles).forEach(([name, state]) => {
        if (state.value) target.style.setProperty(name, state.value, state.priority);
        else target.style.removeProperty(name);
      });
    });

    previewSnapshots.clear();
  }

  function setPreviewText(doc, target, value, snapshot) {
    const textNodes = Array.from(target.childNodes).filter(n => n.nodeType === 3);

    if (textNodes.length) {
      textNodes[0].nodeValue = value;
      textNodes.slice(1).forEach(n => n.nodeValue = '');
    } else {
      const textNode = doc.createTextNode(value);
      target.insertBefore(textNode, target.firstChild);
      snapshot.createdText = textNode;
    }
  }

  function renderRealPageDraft(){
    if (!realPage || preview.tagName !== 'IFRAME') return;

    let doc;
    try {
      doc = preview.contentDocument;
    } catch (_) {
      return;
    }
    if (!doc || !doc.body) return;

    // هر بار ابتدا iframe را به وضعیت پایه برگردان
    restorePreviewTargets();

    const oldBox = doc.getElementById('tenx-admin-draft-preview');
    if (oldBox) oldBox.remove();

    if (!doc.getElementById('tenx-admin-preview-css')) {
      const css = doc.createElement('style');
      css.id = 'tenx-admin-preview-css';
      css.textContent =

        '.tenx-preview-button{display:inline-block;background:#f0c86a;color:#171717;padding:11px 18px;border-radius:10px;text-decoration:none;font-weight:bold;margin:6px 0}' +
        '.tenx-preview-image{max-width:100%;max-height:320px;object-fit:contain;border-radius:14px;display:block;margin:8px 0}' +
        '.tenx-preview-divider{border:0;border-top:1px solid #2c3b59;margin:16px 0}' +

        '.tenx-preview-progress i{display:block;height:100%;background:#f0c86a;width:55%}' +
        '#tenx-admin-draft-preview{display:block;position:relative}';
      doc.head.append(css);
    }

    const main = doc.querySelector('main');
    if (!main) return;

    // انتخاب مستقیم عناصر موجود صفحه فقط در پیش‌نمایش پنل
    if (!doc.documentElement.dataset.tenxPickerInstalled) {
      doc.documentElement.dataset.tenxPickerInstalled = '1';

      const pickerStyle = doc.createElement('style');
      pickerStyle.id = 'tenx-admin-picker-style';
      pickerStyle.textContent = `
        [data-tenx-hover="1"] {
          outline: 2px dashed #e5b94f !important;
          outline-offset: 2px !important;
          cursor: crosshair !important;
        }
        [data-tenx-selected="1"] {
          outline: 3px solid #2563eb !important;
          outline-offset: 2px !important;
        }
      `;
      doc.head.append(pickerStyle);

      function makeSelector(node) {
        if (node.id) return '#' + CSS.escape(node.id);

        const parts = [];
        let cur = node;

        while (cur && cur.nodeType === 1 &&
               cur !== doc.body && parts.length < 6) {
          let part = cur.tagName.toLowerCase();

          if (cur.classList && cur.classList.length) {
            part += '.' + Array.from(cur.classList)
              .slice(0, 2).map(x => CSS.escape(x)).join('.');
          }

          const parent = cur.parentElement;
          if (parent) {
            const siblings = Array.from(parent.children)
              .filter(x => x.tagName === cur.tagName);
            if (siblings.length > 1) {
              part += ':nth-of-type(' + (siblings.indexOf(cur) + 1) + ')';
            }
          }

          parts.unshift(part);
          cur = parent;
        }

        return parts.join(' > ');
      }

      doc.addEventListener('mouseover', ev => {
        const target = ev.target;
        if (!target || !target.closest) return;
        const node = target.closest('body *');
        if (!node || node.closest('#tenx-admin-draft-preview')) return;
        node.setAttribute('data-tenx-hover', '1');
      }, true);

      doc.addEventListener('mouseout', ev => {
        if (ev.target && ev.target.removeAttribute) {
          ev.target.removeAttribute('data-tenx-hover');
        }
      }, true);

      doc.addEventListener('click', ev => {
        const target = ev.target;
        if (!target || !target.closest) return;

        const node = target.closest('body *');
        if (!node || node.closest('#tenx-admin-draft-preview')) return;

        ev.preventDefault();
        ev.stopPropagation();

        const selector = makeSelector(node);

        doc.querySelectorAll('[data-tenx-selected="1"]')
          .forEach(x => x.removeAttribute('data-tenx-selected'));

        node.setAttribute('data-tenx-selected', '1');

        let index = blocks.findIndex(
          b => b.type === 'element' && b.selector === selector
        );

        if (index < 0) {
          const item = {type:'element', selector};

          const text = (node.innerText || node.textContent || '').trim();
          if (text && text.length <= 3000) item.text = text;

          if (node.tagName === 'A' && node.getAttribute('href')) {
            item.href = node.getAttribute('href');
          }

          if (node.tagName === 'IMG') {
            if (node.getAttribute('src')) item.src = node.getAttribute('src');
            if (node.getAttribute('alt')) item.alt = node.getAttribute('alt');
          }

          recordHistory();
          blocks.push(item);
          index = blocks.length - 1;
        }

        selected = index;
        drawInspector();
        drawStage();
      }, true);
    }

    // اعمال تغییرات ذخیره‌نشده روی عناصر واقعی صفحه
    blocks.filter(b => b.type === 'element' && b.selector).forEach(b => {

        const snapshot = previewSnapshots.get(target);

        if (b.deleted === true) {

          return;

        if (typeof b.text === 'string') {
          setPreviewText(doc, target, b.text, snapshot);
        }

        if (typeof b.href === 'string' && target.tagName === 'A') {
          target.setAttribute('href', b.href);
        }

        if (typeof b.src === 'string' && target.tagName === 'IMG') {
          target.setAttribute('src', b.src);
        }

        if (typeof b.alt === 'string' && target.tagName === 'IMG') {
          target.setAttribute('alt', b.alt);
        }

        const styles = {
          color: b.color,
          backgroundColor: b.background,
          fontSize: b.fontSize != null ? b.fontSize + 'px' : undefined,
          fontWeight: b.fontWeight,
          borderRadius: b.borderRadius != null ? b.borderRadius + 'px' : undefined,
          padding: b.padding != null ? b.padding + 'px' : undefined,
          margin: b.margin != null ? b.margin + 'px' : undefined,
          opacity: b.opacity,
          lineHeight: b.lineHeight,
          letterSpacing: b.letterSpacing != null ? b.letterSpacing + 'px' : undefined,
          textAlign: b.textAlign,
          width: b.width != null ? b.width + 'px' : undefined,
          maxWidth: b.maxWidth != null ? b.maxWidth + 'px' : undefined,
          minHeight: b.minHeight != null ? b.minHeight + 'px' : undefined,
          border: b.borderWidth != null
            ? b.borderWidth + 'px solid ' + (b.borderColor || '#64748b')
            : undefined,
          boxShadow: ({
            none:'none',
            soft:'0 2px 10px rgba(0,0,0,.12)',
            medium:'0 5px 18px rgba(0,0,0,.2)',
            strong:'0 10px 30px rgba(0,0,0,.3)'
          })[b.shadow]
        };

        Object.entries(styles).forEach(([key, value]) => {
          if (value !== undefined) target.style[key] = value;
        });
      } catch (_) {}
    });

    const box = doc.createElement('div');
    box.id = 'tenx-admin-draft-preview';
    box.setAttribute('data-admin-preview', 'draft');

    function node(tag, cls, text) {
      const n = doc.createElement(tag);
      if (cls) n.className = cls;
      if (text !== undefined && text !== null) n.textContent = text;
      return n;
    }

    function validPreviewUrl(url) {
      return /^(https:\/\/\S+|\/(?!\/)[^\s]*)$/.test(url || '');
    }

    blocks.forEach(b => {
      let n = null;

      if (b.type === 'heading') {
        n = node('h2', 'tenx-preview-block', b.text || '');
      } else if (b.type === 'text') {
        n = node('p', 'muted btxt tenx-preview-block tenx-preview-text', b.text || '');
      } else if (b.type === 'divider') {
        n = node('hr', 'bdiv tenx-preview-divider');
      } else if (b.type === 'image') {
        if (validPreviewUrl(b.url)) {
          n = node('img', 'bimg tenx-preview-block tenx-preview-image');
          n.src = b.url;
          n.alt = b.alt || '';
        }
      } else if (b.type === 'button') {
        if (validPreviewUrl(b.url)) {
          n = node('a', 'bbtn tenx-preview-block tenx-preview-button', b.text || 'مشاهده');
          n.href = b.url;
        }
      } else if (b.type === 'banner') {
        n = node('section', 'card tenx-preview-block');
        n.append(node('h2', 'gold', b.title || 'بنر'));
        if (b.text) n.append(node('p', 'muted btxt tenx-preview-text', b.text));
        if (b.url && validPreviewUrl(b.url)) {

      } else if (b.type === 'progress') {

          b.title || (b.kind === 'academy' ? 'پیشرفت آکادمی' : 'پیشرفت ثبت‌نام')));

      }

      if (n && b.type !== 'element') box.append(n);
    });

    if (!blocks.some(b => b.type !== 'element')) return;

    const cards = main.querySelectorAll(':scope > section.card');
    const lastCard = cards.length ? cards[cards.length - 1] : null;

      preview.style.height = device === 'mobile' ? '740px' : '820px';
      renderRealPageDraft();
      return;
    }

    frame.style.maxWidth=device==='mobile'?'390px':'100%';
    desktopBtn.style.fontWeight=device==='desktop'?'700':'400';
    mobileBtn.style.fontWeight=device==='mobile'?'700':'400';
    preview.replaceChildren();
    if(!blocks.length){
      preview.append(el('div',{style:{padding:'55px 10px',textAlign:'center',color:'#64748b'}},
        'صفحه خالی است؛ از بخش المان‌ها، بلوک اضافه کن.'));
      return;
    }
    blocks.forEach((b,i)=>{
      const wrap=el('div',{style:{
        position:'relative',padding:'5px',
        border:selected===i?'2px solid #2563eb':'2px solid transparent',
        borderRadius:'8px',margin:'3px 0',cursor:'pointer'
      }});
      wrap.onclick=()=>{selected=i;drawInspector();drawStage()};
      wrap.append(
        b.type==='mm10_step'
          ? originalStepPreview(b)
          : renderBlock(b)
      );
      if(selected===i)wrap.append(el('span',{style:{
        position:'absolute',top:'-9px',right:'5px',fontSize:'10px',
        background:'#2563eb',color:'#fff',padding:'2px 6px',borderRadius:'4px'
      }},labels[b.type]||b.type));
      preview.append(wrap);
    });
  }

  function drawInspector(){
    blockList.replaceChildren();
    blocks.forEach((b,i)=>{
      const row=el('div',{draggable:'true',style:{
        display:'flex',gap:'5px',alignItems:'center',padding:'8px',
        margin:'5px 0',borderRadius:'8px',
        border:selected===i?'2px solid #2563eb':'1px solid #cbd5e1',
        background:selected===i?'#eff6ff':'transparent',cursor:'grab'
      }});
      row.append(el('span',{style:{flex:'1',fontSize:'13px'}},
        (i+1)+'. '+(b.deleted ? 'عنصر حذف‌شده' : (labels[b.type]||b.type))));
      const up=el('button',{type:'button',class:'sec'},'↑');
      const down=el('button',{type:'button',class:'sec'},'↓');
      const duplicate=el('button',{type:'button',class:'sec'},'⧉');
      duplicate.title='تکثیر المان';
      duplicate.onclick=e=>{
        e.stopPropagation();
        if(blocks.length>=40){toast('حداکثر ۴۰ المان مجاز است.');return;}
        recordHistory();
        const cloned=JSON.parse(JSON.stringify(b));
        if(cloned.type==='mm10_step'){
          cloned.id='step-'+Date.now().toString(36)+'-'+
            Math.random().toString(36).slice(2,8);
        }
        blocks.splice(i+1,0,cloned);
        selected=i+1;
        drawInspector();drawStage();
      };
      const remove=el('button',{type:'button',class:'bad'},'×');
      up.onclick=()=>move(i,i-1);
      down.onclick=()=>move(i,i+1);
      remove.onclick=(e)=>{
        e.preventDefault();
        e.stopPropagation();
        recordHistory();
        if (b.type === 'element') {
          b.deleted = true;
        } else {
          blocks.splice(i,1);
        }
        selected=Math.max(0,Math.min(selected,blocks.length-1));
        drawInspector();drawStage();
      };
      row.append(up,down,duplicate,remove);
      row.onclick=()=>{selected=i;drawInspector();drawStage()};
      row.addEventListener('dragstart',e=>{
        e.dataTransfer.setData('text/plain',String(i));
        e.dataTransfer.effectAllowed='move';
      });
      row.addEventListener('dragover',e=>{e.preventDefault();e.dataTransfer.dropEffect='move'});
      row.addEventListener('drop',e=>{
        e.preventDefault();
        const from=Number(e.dataTransfer.getData('text/plain'));
        if(Number.isInteger(from)&&from>=0&&from<blocks.length&&from!==i)move(from,i);
      });
      blockList.append(row);
    });

    settings.replaceChildren(el('h3',{style:{marginTop:'0'}},blocks[selected]?'تنظیمات المان':'تنظیمات المان'));
    const b=blocks[selected];
    if(!b){
      settings.append(el('p',{style:{color:'#64748b',fontSize:'13px'}},'برای شروع یک المان اضافه کن.'));
      return;
    }

    if (b.type === 'element' && b.deleted) {
      settings.append(el('p',{style:{color:'#b45309',fontSize:'13px'}},
        'این عنصر برای حذف علامت‌گذاری شده است.'));
      const restore = el('button',{type:'button',class:'sec'},'بازگردانی عنصر');
      restore.onclick=()=>{
        recordHistory();
        delete b.deleted;
        drawInspector();
        drawStage();
      };
      settings.append(restore);
      return;
    }

    (defs[b.type]||[]).forEach(([key,label,type])=>{
      let input;
      if(type==='select' || type==='weight' || type==='shadow' || type==='align'){
        input=el('select');
        const choices=type==='weight'
          ? [['300','نازک'],['400','معمولی'],['500','متوسط'],['600','نیمه‌ضخیم'],['700','ضخیم'],['800','خیلی ضخیم'],['900','سنگین']]
          : type==='shadow'
            ? [['none','بدون سایه'],['soft','ملایم'],['medium','متوسط'],['strong','قوی']]
            : type==='align'
              ? [['right','راست'],['center','وسط'],['left','چپ'],['justify','تراز دوطرفه']]
              : [['registration','ثبت‌نام'],['academy','آکادمی']];
        choices.forEach(([v,t])=>{
          const o=el('option',{value:v},t);
          o.selected=String(b[key]||(type==='weight'?'400':'registration'))===v;
          input.append(o);
        });
      } else {
        const inputType=type==='color'?'color':type==='number'?'number':'text';
        input=el(type==='textarea'?'textarea':'input',
          type==='textarea'?{rows:'4'}:{type:inputType});
        if(type==='number'){
          const ranges = {
            fontSize:[8,96,1],
            borderRadius:[0,80,1],
            padding:[0,100,1],
            margin:[0,100,1],
            opacity:[0,1,0.05],
            lineHeight:[0.8,3,0.1],
            letterSpacing:[-2,20,0.5],
            width:[0,1200,1],
            maxWidth:[0,1200,1],
            minHeight:[0,1200,1],
            borderWidth:[0,20,1]
          };
          const range=ranges[key]||[0,100,1];
          input.min=String(range[0]);
          input.max=String(range[1]);
          input.step=String(range[2]);
        }
        input.value=b[key]??(type==='color'?(key==='color'?'#ffffff':'#151f34'):'');
      }
      input.addEventListener('input',()=>{
        if(type==='number' && input.value!=='' && !Number.isFinite(Number(input.value))) return;
        recordHistory();
        if(type==='number'){
          if(input.value==='') delete b[key];
          else b[key]=Number(input.value);
        } else {
          b[key]=input.value;
        }
        drawStage();
      });
      settings.append(field(label,input));
    });
    if(b.type==='image'||b.type==='button'||b.type==='banner'){
      settings.append(el('small',{style:{color:'#64748b'}},
        'لینک باید با https:// یا مسیر داخلی مانند /miniapp/... شروع شود.'));
    }
  }

  function move(from,to){
    if(to<0||to>=blocks.length)return;
    recordHistory();
    const item=blocks.splice(from,1)[0];
    blocks.splice(to,0,item);
    selected=to;
    drawInspector();drawStage();
  }

  function cleanBlocks(){
    return blocks.map(b=>Object.fromEntries(
      Object.entries(b).filter(([k,v])=>v!==''&&v!==undefined&&v!==null)
    ));
  }

  async function saveDraft(){
    if(blocks.length>40){
      throw new Error('حداکثر ۴۰ المان مجاز است.');
    }

    saveBtn.disabled=true;
    publishBtn.disabled=true;

    try{
      await api('/content/pages/'+encodeURIComponent(r.slug)+'/draft',{
        method:'PUT',
        body:JSON.stringify({
          title:titleInput.value.trim()||null,
          blocks:cleanBlocks()
        })
      });
      r.hasDraft=true;
      return true;
    }finally{
      saveBtn.disabled=false;
      publishBtn.disabled=false;
    }
  }

  saveBtn.onclick=async()=>{
    try{
      await saveDraft();
      toast('پیش‌نویس ذخیره شد؛ برای نمایش در Mini App انتشار را بزن.');
    }catch(e){
      toast('خطا در ذخیره پیش‌نویس: '+e.message);
    }
  };

  publishBtn.onclick=async()=>{
    if(!confirm('نسخه فعلی منتشر شود و در Mini App نمایش داده شود؟'))return;

    publishBtn.disabled=true;
    saveBtn.disabled=true;

    try{
      await saveDraft();

      const result=await api('/content/pages/'+encodeURIComponent(r.slug)+'/publish',{
        method:'POST',
        body:JSON.stringify({})
      });

      publishedStatus=result.status||'PUBLISHED';
      statusLabel.textContent='نسخه زنده: منتشرشده';
      statusLabel.className='tag ok';

      toast('صفحه با موفقیت در Mini App منتشر شد.');
    }catch(e){
      toast('خطا در انتشار: '+e.message);
    }finally{
      publishBtn.disabled=false;
      saveBtn.disabled=false;
    }
  };

  if(isStandalone){
    d.replaceChildren(shell);
  }else{
    d.classList.remove('hide');
    d.onclick=e=>{if(e.target===d)d.classList.add('hide')};
    d.replaceChildren(shell);
  }
  drawInspector();
  drawStage();
}function editPopup(o){const isNew=!o||!o.id;o=o||{};const f={title:h('input',{value:o.title||''}),body:h('textarea',{rows:5}),imageUrl:h('input',{value:o.imageUrl||'',placeholder:'https://… یا /مسیر'}),buttonText:h('input',{value:o.buttonText||''}),buttonUrl:h('input',{value:o.buttonUrl||'',placeholder:'/miniapp/challenge.html'}),
pageSlug:h('select',{},SLUGS.map(s=>h('option',{selected:(o.pageSlug||'index')===s?'':null},s))),frequency:h('select',{},['ONCE','EVERY_VISIT'].map(s=>h('option',{selected:(o.frequency||'ONCE')===s?'':null},s))),status:h('select',{},['DRAFT','PUBLISHED'].map(s=>h('option',{selected:(o.status||'DRAFT')===s?'':null},s)))};
f.body.value=o.body||'';Object.values(f).forEach(e=>e.style.width='100%');

const save=async()=>{const b={};for(const[k,e]of Object.entries(f)){const v=e.value.trim();b[k]=['imageUrl','buttonText','buttonUrl'].includes(k)?(v||null):v}try{await api(url,{method:isNew?'POST':'PATCH',body:JSON.stringify(b)});$('#drawer').classList.add('hide');toast('ذخیره شد.');show('pages')}catch(e){toast('خطا: '+e.message)}};

d.replaceChildren(h('div',{class:'card'},h('b',{},isNew?'پاپ‌آپ جدید':'ویرایش پاپ‌آپ'),Object.entries(f).map(([k,e])=>h('div',{style:'margin:8px 0'},h('label',{class:'mut'},k),e)),h('div',{class:'row'},h('button',{onclick:save},'ذخیره'),!isNew&&h('button',{class:'bad',onclick:del},'حذف'),h('button',{class:'sec',onclick:()=>d.classList.add('hide')},'بستن'))))}
function drawer(u){const d=$('#drawer');d.classList.remove('hide');d.replaceChildren(h('div',{class:'card'},h('div',{class:'row',style:'justify-content:space-between'},h('b',{},'جزئیات کاربر'),h('button',{class:'sec',onclick:()=>d.classList.add('hide')},'بستن')),h('dl',{},Object.entries(u).flatMap(([k,v])=>[h('dt',{},k),h('dd',{},/At$/.test(k)?fa(v):String(v??'—'))]))));d.onclick=e=>{if(e.target===d)d.classList.add('hide')}}

<script>
(function(){
 const token=()=>sessionStorage.getItem('tenx_admin_token')||'';
 async function call(path,method='GET',body){

 }

 window.tenxBotLogs=async function(){

 };


 let tenxConfig=null;

 function tbcElement(tag,attrs={},value){
  const el=document.createElement(tag);
  Object.entries(attrs).forEach(([k,v])=>{
   if(k==='class')el.className=v;
   else if(k==='style')el.style.cssText=v;
   else el.setAttribute(k,v);
  });
  if(value!==undefined)el.textContent=value;
  return el;
 }
 function tbcField(parent,label,value,type,onChange){
  const wrap=tbcElement('label',{style:'display:block;flex:1;min-width:130px;margin:5px'});
  wrap.appendChild(tbcElement('span',{style:'display:block;font-size:12px;margin-bottom:4px'},label));
  const el=tbcElement(type==='textarea'?'textarea':'input',{
   style:'width:100%;box-sizing:border-box',
   ...(type==='textarea'?{rows:'3'}:{type:type||'text'})
  });
  if(type==='checkbox')el.checked=!!value;
  else el.value=value??'';
  el.addEventListener('change',()=>onChange(type==='checkbox'?el.checked:el.value));
  if(type!=='checkbox')el.addEventListener('input',()=>onChange(el.value));
  wrap.appendChild(el);
  parent.appendChild(wrap);
  return el;
 }
 function tbcRenderButtons(){
  const root=document.getElementById('tbc-buttons-list');

   tbcField(row,'عنوان دکمه',item.label,'text',v=>item.label=v);

   const enabled=tbcField(row,'فعال',item.enabled,'checkbox',v=>item.enabled=v);
   card.appendChild(row);
   root.appendChild(card);
  });
 }
 function tbcRenderReplies(){
  const root=document.getElementById('tbc-replies-list');
  root.replaceChildren();
  (tenxConfig.autoReplies||[]).forEach((item,i)=>{
   const card=tbcElement('div',{class:'card',style:'margin:8px 0;padding:12px'});
   const row=tbcElement('div',{style:'display:flex;flex-wrap:wrap;gap:8px'});
   tbcField(row,'کلمه کلیدی',item.keyword,'text',v=>item.keyword=v);
   tbcField(row,'متن پاسخ',item.response,'textarea',v=>item.response=v);

 }
 function tbcMakeSelect(parent,label,value,options,onChange){
  const wrap=tbcElement('label',{style:'display:block;flex:1;min-width:150px;margin:5px'});
  wrap.appendChild(tbcElement('span',{style:'display:block;font-size:12px;margin-bottom:4px'},label));

 function tbcRenderChallengeSetting(){

   tenxConfig.challengeLessonId=v||null;
  });

  host.appendChild(card);
 }
 function tbcRenderBlocks(parent,item){
  const section=tbcElement('div',{style:'margin-top:12px;padding:10px;border:1px solid var(--border,#8885);border-radius:10px'});
  section.appendChild(tbcElement('b',{},'محتوای بلوکی'));
  const list=tbcElement('div',{});
  const render=()=>{
   list.replaceChildren();
   (item.blocks||[]).forEach((block,index)=>{
    const line=tbcElement('div',{style:'margin:8px 0;padding:10px;border:1px dashed #8888;border-radius:8px'});
    const fields=tbcElement('div',{style:'display:flex;flex-wrap:wrap;gap:6px'});
    tbcMakeSelect(fields,'نوع بلوک',block.type||'text',[
     ['text','متن'],['image','تصویر'],['video','ویدئو'],['link','لینک'],['separator','جداکننده']
    ],v=>{block.type=v;render();});
    if(block.type==='text'){
     tbcField(fields,'متن',block.text||'','textarea',v=>block.text=v);
    }else if(['image','video','link'].includes(block.type)){
     tbcField(fields,'آدرس HTTPS',block.url||'','url',v=>block.url=v);
     if(block.type!=='link')tbcField(fields,'توضیح تصویر/ویدئو',block.caption||'','text',v=>block.caption=v);
     else tbcField(fields,'متن معرفی لینک',block.text||'','text',v=>block.text=v);
    }
    const del=tbcElement('button',{type:'button',class:'bad'},'حذف بلوک');
    del.addEventListener('click',()=>{item.blocks.splice(index,1);render();});
    line.append(fields,del);
    list.appendChild(line);
   });
  };
  const addRow=tbcElement('div',{style:'display:flex;flex-wrap:wrap;gap:8px;align-items:center'});
  const addType=tbcMakeSelect(addRow,'افزودن بلوک','text',[
   ['text','متن'],['image','تصویر'],['video','ویدئو'],['link','لینک'],['separator','جداکننده']
  ],()=>{});
  const add=tbcElement('button',{type:'button'},'افزودن بلوک');
  add.addEventListener('click',()=>{
   item.blocks=item.blocks||[];
   if(item.blocks.length>=20){toast('حداکثر ۲۰ بلوک برای هر گزینه مجاز است.');return;}
   item.blocks.push({type:addType.value,text:'',url:'',caption:''});
   render();
  });
  addRow.appendChild(add);
  section.append(list,addRow);
  parent.appendChild(section);
  render();
 }
 function tbcRenderMenu(){
  const root=document.getElementById('tbc-menu-list');
  root.replaceChildren();
  (tenxConfig.customMenu||[]).forEach((item,i)=>{
   item.action=item.action||'reply';
   item.blocks=item.blocks||[];
   const card=tbcElement('div',{class:'card',style:'margin:8px 0;padding:12px'});
   card.appendChild(tbcElement('b',{},`گزینه منو ${i+1}`));
   const row=tbcElement('div',{style:'display:flex;flex-wrap:wrap;gap:8px'});
   tbcField(row,'عنوان دکمه',item.label,'text',v=>item.label=v);
   tbcMakeSelect(row,'نوع عملکرد',item.action,[
    ['reply','ارسال محتوا'],['url','لینک خارجی'],['web_app','بازکردن Mini App'],['academy_lesson','بازکردن درس آکادمی']
   ],v=>{item.action=v;tbcRenderMenu();});
   tbcField(row,'فعال',item.enabled,'checkbox',v=>item.enabled=v);
   card.appendChild(row);
   if(item.action==='reply'){
    tbcField(card,'متن پاسخ ساده (اختیاری)',item.response||'','textarea',v=>item.response=v);
    tbcRenderBlocks(card,item);
   }else if(item.action==='url'||item.action==='web_app'){
    tbcField(card,'آدرس مقصد HTTPS',item.url||'','url',v=>item.url=v);
   }else if(item.action==='academy_lesson'){
    const lessonRow=tbcElement('div',{style:'display:flex;flex-wrap:wrap;gap:8px'});
    tbcMakeSelect(lessonRow,'درس مقصد',item.lessonId||'',tbcLessonOptions(),v=>item.lessonId=v);
    card.appendChild(lessonRow);
   }
   const preview=tbcElement('div',{style:'margin-top:10px;padding:10px;background:var(--card-bg,#8881);border-radius:8px'});
   preview.appendChild(tbcElement('b',{},'پیش‌نمایش'));
   preview.appendChild(tbcElement('div',{style:'margin-top:5px'},item.label||'عنوان دکمه'));
   if(item.action==='reply'){
    (item.blocks||[]).forEach(block=>{
     const line=block.type==='separator'?'━━━━━━━━━━━━':
      block.type==='image'?'🖼 تصویر: '+(block.url||'بدون آدرس'):
      block.type==='video'?'🎬 ویدئو: '+(block.url||'بدون آدرس'):
      block.type==='link'?'🔗 '+(block.text||block.url||'لینک'):
      block.text||'متن خالی';
     preview.appendChild(tbcElement('div',{style:'font-size:12px;margin-top:4px'},line));
    });
    if(!(item.blocks||[]).length&&item.response)preview.appendChild(tbcElement('div',{},item.response));
   }else{
    preview.appendChild(tbcElement('div',{style:'font-size:12px;margin-top:4px'},item.action==='academy_lesson'?'🎓 درس آکادمی':item.action==='web_app'?'🚀 Mini App':'🔗 '+(item.url||'لینک تنظیم نشده')));
   }
   card.appendChild(preview);
   const del=tbcElement('button',{type:'button',class:'bad',style:'margin-top:10px'},'حذف گزینه');
   del.addEventListener('click',()=>{tenxConfig.customMenu.splice(i,1);tbcRenderMenu();});
   card.appendChild(del);
   root.appendChild(card);
  });
 }
 window.tenxBotAddReply=function(){
  if(!tenxConfig)return;
  if(tenxConfig.autoReplies.length>=50){toast('حداکثر ۵۰ پاسخ مجاز است.');return;}
  tenxConfig.autoReplies.push({keyword:'',response:'',enabled:true});
  tbcRenderReplies();
 };
 window.tenxBotAddMenu=function(){
  if(!tenxConfig)return;
  if(tenxConfig.customMenu.length>=30){toast('حداکثر ۳۰ گزینه منو مجاز است.');return;}
  tenxConfig.customMenu.push({label:'',response:'',enabled:true,action:'reply',blocks:[]});
  tbcRenderMenu();
 };
 window.tenxBotLoadConfig=async function(){
  const msg=document.getElementById('tbc-message');
  msg.textContent='در حال دریافت تنظیمات...';
  try{
   const d=await call('/admin/bot/config');
   tenxConfig=JSON.parse(JSON.stringify(d.config));
   tenxConfig.autoReplies=tenxConfig.autoReplies||[];
   tenxConfig.customMenu=tenxConfig.customMenu||[];
   tenxConfig.builtInButtons=tenxConfig.builtInButtons||[];
   tenxConfig.challengeLessonId=tenxConfig.challengeLessonId||null;
   window.tbcLessons=[];
   try{
    const academy=await call('/admin/academy/courses');
    window.tbcLessons=(academy.items||[]).filter(c=>c.status==='PUBLISHED').flatMap(c=>(c.lessons||[]).filter(l=>l.status==='PUBLISHED').map(l=>({id:l.id,title:l.title,courseTitle:c.title})));
   }catch(academyError){console.warn('Academy lesson list unavailable',academyError);}
   document.getElementById('tbc-enabled').checked=tenxConfig.enabled!==false;
   document.getElementById('tbc-welcome').value=tenxConfig.welcomeMessage||'';
   tbcRenderButtons();
   tbcRenderReplies();
   tbcRenderMenu();
   tbcRenderChallengeSetting();
   document.getElementById('tenx-bot-config').classList.remove('hide');
   msg.textContent='تنظیمات بارگذاری شد.';
  }catch(e){msg.textContent='خطا در دریافت تنظیمات: '+e.message;}
 };
 window.tenxBotSaveConfig=async function(){
  const msg=document.getElementById('tbc-message');
  if(!tenxConfig)return;
  const reserved=[
   '🔄 بررسی مجدد عضویت','✅ موافقم و ادامه می‌دهم',
   '❌ فعلاً ادامه نمی‌دهم','📝 وضعیت ثبت‌نام','🎓 آکادمی',
   '🏆 چالش 10X','💬 پشتیبانی','🚀 ورود به 10X Mini App',
   '📱 اشتراک‌گذاری شماره تلفن'
  ];
  const labels=tenxConfig.customMenu.map(x=>x.label.trim());
  if(labels.some(x=>reserved.includes(x))){
   msg.textContent='عنوان یکی از گزینه‌های منو رزرو شده است.';
   return;
  }
  if(new Set(labels).size!==labels.length){
   msg.textContent='عنوان گزینه‌های منو نباید تکراری باشد.';
   return;
  }
  if(tenxConfig.builtInButtons.length!==9){
   msg.textContent='تعداد دکمه‌های داخلی باید دقیقاً ۹ عدد باشد.';
   return;
  }
  const ids=tenxConfig.builtInButtons.map(x=>x.id);
  if(new Set(ids).size!==9){
   msg.textContent='شناسه دکمه‌های داخلی تکراری است.';
   return;
  }
  const config={
   enabled:document.getElementById('tbc-enabled').checked,
   welcomeMessage:document.getElementById('tbc-welcome').value.trim(),
   challengeLessonId:tenxConfig.challengeLessonId||null,
   autoReplies:tenxConfig.autoReplies,
   customMenu:tenxConfig.customMenu,
   builtInButtons:tenxConfig.builtInButtons
  };
  msg.textContent='در حال ذخیره...';
  try{
   await call('/admin/bot/config','PUT',config);
   msg.textContent='تنظیمات با موفقیت ذخیره شد.';
   toast('تنظیمات ربات ذخیره شد.');
   await tenxBotLoadConfig();
  }catch(e){msg.textContent='ذخیره ناموفق: '+e.message;}
 };

 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',tenxBotStatus);
 else tenxBotStatus();
})();
</script>
