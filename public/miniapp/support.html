<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#070a09">
  <title>پشتیبانی 10X</title>
  <link rel="stylesheet" href="/miniapp/10x-theme.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --support-bg: #070a09;
      --support-card: #101713;
      --support-border: rgba(255,255,255,.09);
      --support-green: #b7f36b;
      --support-muted: #89958d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      background: var(--support-bg);
      color: #f3f7f3;
      font-family: Tahoma,Arial,sans-serif;
    }
    button,input,textarea { font: inherit; }
    button { cursor: pointer; }
    .support-shell {
      width: min(100%,760px);
      min-height: 100dvh;
      margin: auto;
      display: flex;
      flex-direction: column;
      padding: max(12px,env(safe-area-inset-top)) 14px
        max(12px,env(safe-area-inset-bottom));
    }
    .support-header {
      display:flex;align-items:center;gap:12px;
      padding:12px 2px 17px;border-bottom:1px solid var(--support-border);
    }
    .back-link {
      width:42px;height:42px;border:1px solid var(--support-border);
      border-radius:14px;display:grid;place-items:center;
      color:white;text-decoration:none;font-size:25px;
    }
    .brand-icon {
      width:43px;height:43px;border-radius:14px;
      display:grid;place-items:center;background:rgba(183,243,107,.12);
      color:var(--support-green);font-weight:900;font-size:17px;
    }
    .header-info { flex:1;min-width:0; }
    .header-info strong { display:block;font-size:15px; }
    .header-info small { display:block;color:var(--support-muted);font-size:11px;margin-top:5px; }
    .online-dot {
      width:8px;height:8px;border-radius:50%;background:var(--support-green);
      display:inline-block;margin-left:5px;
    }
    .support-actions { display:flex;gap:8px;align-items:center; }
    .new-btn {
      border:1px solid rgba(183,243,107,.35);background:rgba(183,243,107,.1);
      color:var(--support-green);border-radius:12px;padding:10px 12px;font-size:12px;
    }
    .ticket-area { padding:14px 0 10px; }
    .section-label { color:var(--support-muted);font-size:11px;margin:0 0 9px; }
    .ticket-list {
      display:flex;gap:8px;overflow-x:auto;padding:1px 0 7px;
      scrollbar-width:none;
    }
    .ticket-list::-webkit-scrollbar { display:none; }
    .ticket-chip {
      flex:0 0 auto;max-width:210px;text-align:right;
      border:1px solid var(--support-border);background:var(--support-card);
      color:#dce5de;border-radius:12px;padding:10px 12px;font-size:11px;
    }
    .ticket-chip.active {
      border-color:rgba(183,243,107,.6);background:rgba(183,243,107,.08);
    }
    .ticket-chip span { display:block;color:var(--support-muted);font-size:10px;margin-top:5px; }
    .chat-card {
      flex:1;min-height:300px;display:flex;flex-direction:column;
      background:linear-gradient(160deg,#101713,#0b100d);
      border:1px solid var(--support-border);border-radius:20px;overflow:hidden;
    }
    .chat-top {
      padding:13px 15px;border-bottom:1px solid var(--support-border);
      display:flex;justify-content:space-between;align-items:center;gap:10px;
    }
    .chat-top strong { font-size:13px; }
    .status-pill {
      color:var(--support-green);background:rgba(183,243,107,.09);
      border-radius:30px;padding:6px 9px;font-size:10px;white-space:nowrap;
    }
    .messages {
      flex:1;min-height:250px;max-height:calc(100dvh - 340px);
      overflow-y:auto;padding:17px 13px;display:flex;flex-direction:column;gap:13px;
      overscroll-behavior:contain;
    }
    .empty-state {
      margin:auto;text-align:center;max-width:260px;padding:25px 12px;
      color:var(--support-muted);font-size:12px;line-height:2.1;
    }
    .empty-icon {
      width:58px;height:58px;border-radius:20px;margin:0 auto 13px;
      display:grid;place-items:center;background:rgba(183,243,107,.09);
      color:var(--support-green);font-size:25px;
    }
    .message { max-width:86%;display:flex;flex-direction:column;gap:5px; }
    .message.user { align-self:flex-start; }
    .message.admin { align-self:flex-end; }
    .message-meta { font-size:10px;color:var(--support-muted);padding:0 5px; }
    .bubble {
      padding:11px 13px;border-radius:15px;font-size:13px;line-height:1.9;
      white-space:pre-wrap;overflow-wrap:anywhere;
    }
    .message.user .bubble {
      background:#1b2920;border:1px solid rgba(183,243,107,.12);
      border-bottom-right-radius:4px;
    }
    .message.admin .bubble {
      background:#202a25;border:1px solid var(--support-border);
      border-bottom-left-radius:4px;
    }
    .composer-wrap {
      border-top:1px solid var(--support-border);padding:12px;
      background:rgba(0,0,0,.13);
    }
    .new-subject {
      display:none;width:100%;margin-bottom:9px;padding:12px;
      background:#0a100c;border:1px solid var(--support-border);
      border-radius:12px;color:white;outline:none;font-size:12px;
    }
    .new-subject.show { display:block; }
    .composer {
      display:flex;align-items:flex-end;gap:9px;
    }
    .composer textarea {
      flex:1;min-width:0;resize:none;min-height:45px;max-height:120px;
      padding:12px;background:#080d0a;border:1px solid var(--support-border);
      border-radius:14px;color:white;outline:none;font-size:13px;line-height:1.7;
    }
    .composer textarea:focus,.new-subject:focus { border-color:rgba(183,243,107,.5); }
    .send-btn {
      flex:0 0 47px;height:45px;border:0;border-radius:14px;
      background:var(--support-green);color:#10160c;font-weight:bold;font-size:19px;
    }
    .send-btn:disabled { opacity:.45;cursor:not-allowed; }
    .hint { font-size:10px;color:var(--support-muted);margin:8px 3px 0; }
    .notice { font-size:11px;color:var(--support-muted);text-align:center;padding:9px; }
    .notice.error { color:#ff9c91; }
    .refresh-btn {
      background:none;border:0;color:var(--support-green);font-size:11px;padding:5px;
    }
    @media (max-height:650px) {
      .messages { max-height:calc(100dvh - 290px); }
    }
  </style>
</head>
<body>
  <main class="support-shell">
    <header class="support-header">
      <a class="back-link" href="/miniapp" aria-label="بازگشت">‹</a>
      <div class="brand-icon">10X</div>
      <div class="header-info">
        <strong>پشتیبانی 10X</strong>
        <small><i class="online-dot"></i>همراهت هستیم</small>
      </div>
      <div class="support-actions">
        <button class="new-btn" id="new-ticket-btn" type="button">گفتگوی جدید +</button>
      </div>
    </header>

    <section class="ticket-area">
      <p class="section-label">گفتگوهای من</p>
      <div class="ticket-list" id="ticket-list"></div>
    </section>

    <section class="chat-card">
      <div class="chat-top">
        <strong id="chat-title">گفتگو با پشتیبانی</strong>
        <span class="status-pill" id="ticket-status">در حال بارگذاری</span>
      </div>
      <div class="messages" id="messages" aria-live="polite">
        <div class="empty-state">در حال دریافت گفتگوها...</div>
      </div>
      <div class="composer-wrap">
        <input id="subject" class="new-subject" maxlength="150"
          placeholder="موضوع درخواستت را بنویس">
        <div class="composer">
          <textarea id="message-input" rows="1"
            placeholder="پیامت را اینجا بنویس..." maxlength="3500"></textarea>
          <button class="send-btn" id="send-btn" type="button" aria-label="ارسال">➤</button>
        </div>
        <div class="hint" id="composer-hint">برای ارسال پیام روی دکمه ارسال بزن</div>
      </div>
    </section>
    <div class="notice" id="notice"></div>
  </main>

<script>
(function () {
  'use strict';

  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
  }

  var initData = tg && tg.initData ? tg.initData : '';
  var tickets = [];
  var activeId = null;
  var creating = false;
  var sending = false;
  var loading = false;
  var lastSignature = '';

  var $ = function (id) { return document.getElementById(id); };

  var statusNames = {
    OPEN: 'در انتظار بررسی',
    IN_PROGRESS: 'در حال پیگیری',
    WAITING_USER: 'منتظر پاسخ شما',
    RESOLVED: 'حل‌شده',
    CLOSED: 'بسته‌شده'
  };

  function notify(message, error) {
    var el = $('notice');
    el.textContent = message || '';
    el.className = error ? 'notice error' : 'notice';
  }

  function request(url, options) {
    return fetch(url, options).then(function (response) {
      return response.json().catch(function () { return {}; }).then(function (data) {
        if (!response.ok) {
          var err = new Error(data.error || 'request_failed');
          err.status = response.status;
          throw err;
        }
        return data;
      });
    });
  }

  function post(url, data) {
    return request(url, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(Object.assign({ initData: initData }, data || {}))
    });
  }

  function formatDate(value) {
    try {
      return new Date(value).toLocaleString('fa-IR', {
        month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
      });
    } catch (_) { return ''; }
  }

  function activeTicket() {
    return tickets.find(function (item) { return item.id === activeId; }) || null;
  }

  function addText(parent, tag, className, value) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    node.textContent = value == null ? '' : String(value);
    parent.appendChild(node);
    return node;
  }

  function renderTickets() {
    var list = $('ticket-list');
    list.replaceChildren();

    if (!tickets.length) {
      addText(list, 'span', 'section-label', 'هنوز گفتگویی ثبت نکرده‌ای');
      return;
    }

    tickets.forEach(function (ticket) {
      var button = document.createElement('button');
      button.type = 'button';
      button.className = 'ticket-chip' + (ticket.id === activeId ? ' active' : '');
      button.textContent = ticket.subject || 'درخواست پشتیبانی';
      addText(button, 'span', '', statusNames[ticket.status] || ticket.status);
      button.addEventListener('click', function () {
        creating = false;
        activeId = ticket.id;
        lastSignature = '';
        render();
      });
      list.appendChild(button);
    });
  }

  function renderMessages(ticket) {
    var box = $('messages');
    box.replaceChildren();

    if (!ticket || !ticket.messages || !ticket.messages.length) {
      var empty = document.createElement('div');
      empty.className = 'empty-state';
      var icon = addText(empty, 'div', 'empty-icon', '✦');
      addText(empty, 'strong', '', creating ? 'شروع گفتگوی جدید' : 'گفتگوی شما');
      addText(empty, 'p', '', creating
        ? 'موضوع و پیام خودت را بنویس تا درخواستت برای تیم پشتیبانی ارسال شود.'
        : 'هنوز پیامی در این گفتگو ثبت نشده است.');
      box.appendChild(empty);
      return;
    }

    ticket.messages.forEach(function (message) {
      var isUser = message.senderType === 'USER';
      var row = document.createElement('div');
      row.className = 'message ' + (isUser ? 'user' : 'admin');
      addText(row, 'div', 'message-meta',
        (isUser ? 'شما' : 'تیم پشتیبانی') + ' · ' + formatDate(message.createdAt));
      addText(row, 'div', 'bubble', message.body);
      box.appendChild(row);
    });

    box.scrollTop = box.scrollHeight;
  }

  function render() {
    renderTickets();
    var ticket = activeTicket();
    $('subject').classList.toggle('show', creating);
    $('chat-title').textContent = creating
      ? 'درخواست پشتیبانی جدید'
      : (ticket ? ticket.subject : 'گفتگو با پشتیبانی');

    $('ticket-status').textContent = creating
      ? 'گفتگوی جدید'
      : (ticket ? (statusNames[ticket.status] || ticket.status) : 'بدون گفتگو');

    var closed = ticket && ['RESOLVED', 'CLOSED'].includes(ticket.status);
    $('message-input').disabled = Boolean(closed);
    $('send-btn').disabled = sending || (!creating && (!ticket || closed));
    $('message-input').placeholder = closed
      ? 'این گفتگو بسته شده است؛ گفتگوی جدید بساز'
      : 'پیامت را اینجا بنویس...';
    $('composer-hint').textContent = closed
      ? 'برای ادامه ارتباط، یک گفتگوی جدید ایجاد کن'
      : 'Enter برای ارسال · Shift + Enter برای خط جدید';

    renderMessages(ticket);
  }

  function signatureOf(items) {
    return JSON.stringify(items.map(function (t) {
      return [t.id, t.status, t.updatedAt,
        (t.messages || []).map(function (m) { return m.id; })];
    }));
  }

  function loadTickets(silent) {
    if (!initData) {
      notify('این صفحه باید از داخل تلگرام باز شود.', true);
      $('messages').replaceChildren();
      addText($('messages'), 'div', 'empty-state',
        'اطلاعات احراز هویت تلگرام در دسترس نیست. صفحه را از Mini App باز کن.');
      return Promise.resolve();
    }

    if (loading) return Promise.resolve();
    loading = true;

    return post('/support/tickets/list', {})
      .then(function (data) {
        var items = Array.isArray(data.items) ? data.items : [];
        var signature = signatureOf(items);
        var changed = signature !== lastSignature;
        tickets = items;
        lastSignature = signature;

        if (!tickets.some(function (t) { return t.id === activeId; })) {
          activeId = tickets.length ? tickets[0].id : null;
        }

        if (!creating) render();
        if (!silent) notify('');
        if (changed && !creating) {
          var box = $('messages');
          box.scrollTop = box.scrollHeight;
        }
      })
      .catch(function (error) {
        if (!silent) notify(error.message === 'invalid_telegram_init_data'
          ? 'اعتبار نشست تلگرام منقضی شده است؛ صفحه را دوباره باز کن.'
          : 'دریافت گفتگوها با خطا مواجه شد. دوباره تلاش کن.', true);
      })
      .finally(function () { loading = false; });
  }

  function sendMessage() {
    if (sending) return;
    var body = $('message-input').value.trim();
    if (!body) return notify('اول متن پیامت را بنویس.', true);
    if (!initData) return notify('احراز هویت تلگرام انجام نشده است.', true);

    sending = true;
    $('send-btn').disabled = true;
    notify('در حال ارسال پیام...');

    var action;
    if (creating) {
      var subject = $('subject').value.trim();
      if (subject.length < 3) {
        sending = false;
        render();
        return notify('موضوع باید حداقل ۳ حرف داشته باشد.', true);
      }

      action = post('/public/tickets', { subject: subject, body: body })
        .then(function () {
          $('message-input').value = '';
          $('subject').value = '';
          creating = false;
          activeId = null;
          lastSignature = '';
          return loadTickets(true);
        });
    } else {
      var ticket = activeTicket();
      if (!ticket) {
        sending = false;
        render();
        return notify('ابتدا یک گفتگوی جدید ایجاد کن.', true);
      }

      action = post('/support/tickets/' + encodeURIComponent(ticket.id) + '/messages', { body: body })
        .then(function () {
          $('message-input').value = '';
          return loadTickets(true);
        });
    }

    action.then(function () {
      notify('پیامت با موفقیت ارسال شد.');
      render();
    }).catch(function (error) {
      if (error.status === 409) {
        notify('این گفتگو بسته شده است. یک گفتگوی جدید ایجاد کن.', true);
      } else {
        notify('ارسال پیام انجام نشد. دوباره تلاش کن.', true);
      }
    }).finally(function () {
      sending = false;
      render();
    });
  }

  $('new-ticket-btn').addEventListener('click', function () {
    creating = true;
    activeId = null;
    $('subject').value = '';
    $('message-input').value = '';
    lastSignature = '';
    render();
    $('subject').focus();
  });

  $('send-btn').addEventListener('click', sendMessage);

  $('message-input').addEventListener('keydown', function (event) {
    if (event.key === 'Enter' && !event.shiftKey) {
      event.preventDefault();
      sendMessage();
    }
  });

  $('message-input').addEventListener('input', function () {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 120) + 'px';
  });

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) loadTickets(true);
  });

  render();
  loadTickets(false);

  window.setInterval(function () {
    if (!document.hidden) loadTickets(true);
  }, 12000);
})();
</script>
</body>
</html>
