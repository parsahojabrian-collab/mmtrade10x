<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#061810"><title>P77 — ادیتور پروفایل</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#06140f;color:#f3eee4;font:14px/1.7 Tahoma,Arial,sans-serif}header{padding:13px 18px;border-bottom:1px solid #4d8267;background:#0d3025;display:flex;gap:10px;flex-wrap:wrap;align-items:center}header h1{font-size:17px;margin:0;flex:1}button{background:#164234;border:1px solid #9fba8b;color:#fff;border-radius:10px;padding:9px 13px;cursor:pointer}button.primary{background:linear-gradient(120deg,#e9c08a,#af794b);color:#171c15;font-weight:bold}button:focus-visible,input:focus-visible{outline:2px solid #71e9b1}main{display:grid;grid-template-columns:minmax(295px,380px) 1fr;gap:12px;padding:12px;max-width:1600px;margin:auto}aside{max-height:calc(100vh - 90px);overflow:auto;padding:10px 15px;border:1px solid #486d59;border-radius:14px;background:#0b251d}fieldset{border:1px solid #527968;border-radius:12px;margin:10px 0;padding:10px}legend{padding:0 6px;color:#f4c48c;font-weight:bold}label{display:flex;flex-direction:column;gap:3px;margin:9px 0;font-size:12px}input{border:1px solid #527c66;border-radius:8px;background:#091e17;color:#fff;padding:8px;min-height:35px;font:13px Tahoma;direction:rtl}input[type=number]{direction:ltr;text-align:left}label.check{flex-direction:row;align-items:center;gap:8px}label.check input{min-height:auto}section.preview{min-width:0;display:grid;justify-items:center;gap:6px}iframe{width:390px;max-width:100%;height:810px;border:2px solid #d5ae7d;border-radius:23px;background:#04100b}small{color:#a6beb0}.hint{padding:9px;border:1px solid #35654d;background:#12392b;border-radius:10px;line-height:1.8}.note{margin-top:10px;color:#e8c187}textarea{width:100%;height:100px;direction:ltr;text-align:left;color:white;background:#031910;border:1px solid #64816b;border-radius:8px;font:12px monospace}#status{font-size:12px;color:#78f4b8;min-width:140px}@media(max-width:820px){main{grid-template-columns:1fr}aside{max-height:none}iframe{height:770px}section.preview{order:-1}}
</style></head><body>
<header><h1>✦ P77 — ادیتور پروفایل MMTrade</h1><button id="save" class="primary">ذخیره پیش‌نویس محلی</button><button id="export">خروجی JSON</button><button id="import">ورود JSON</button><button id="reset">بازنشانی</button><span id="status"></span></header>
<main><aside id="fields"><p class="hint">این ادیتور بدون نیاز به سرور، ظاهر پروفایل را زنده تغییر می‌دهد. ذخیره این صفحه فقط در مرورگر فعلی است؛ انتشار برای کاربران مستلزم اتصال به Studio و API معتبر است.</p></aside><section class="preview"><iframe id="frame" title="پیش‌نمایش زنده پروفایل" src="./preview.html"></iframe><small>نمای موبایل؛ دکمه‌ها و منوها واقعی هستند.</small></section></main>
<script src="./editor.js"></script></body></html>
