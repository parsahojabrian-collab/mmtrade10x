<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061710"><title>مدیریت ePlanet | MMTrade</title><link rel="stylesheet" href="/miniapp/p74/eplanet/admin.css?v=EPLANET_FIX_R3"></head><body><main>
<header><b>MMTRADE 10X</b><span>مدیریت محتوای ePlanet</span></header>
<section class="panel"><h1>ورود مدیر ارشد</h1><p>توکن نشست مدیر ارشد را وارد کنید؛ توکن در مرورگر ذخیره نمی‌شود.</p><input id="token" type="password" autocomplete="off" placeholder="Session token"><button id="load">اتصال و بارگذاری</button><small id="msg" role="status" aria-live="polite"></small></section>
<section class="panel" id="editor" hidden><h2>ویرایش محتوای صفحه</h2><label>عنوان اصلی<input id="title"></label><label>زیرعنوان<input id="subtitle"></label><label>لینک ثبت‌نام<input id="registerUrl" dir="ltr"></label><label>تصویر اصلی (URL یا مسیر assets)<input id="heroImage" dir="ltr"></label><div id="steps"></div><button id="save">ذخیره تنظیمات</button></section>
<section class="panel" id="requests" hidden><h2>درخواست‌های در انتظار تأیید</h2><div id="queue"></div><button id="reload">به‌روزرسانی درخواست‌ها</button></section></main><script src="/miniapp/p74/eplanet/admin.js?v=EPLANET_FIX_R3"></script></body></html>
