<body class="academy-page">
  <div class="academy-atmosphere" aria-hidden="true"></div>
  <main class="academy-shell wrap">
    <section class="s1" id="course-index">
      <header class="academy-header hd">
        <img class="bb" src="/miniapp/p74/learning/academy-assets/academy-mmtrade-header.webp" alt="" aria-hidden="true">
        <div class="academy-brand" hidden></div>
        <img class="academy-logo logo" src="/miniapp/p74/copytrade-academy/assets/logo.webp" alt="آکادمی MMTRADE">
        <h1 id="academy-title" class="ttl glass">آکادمی MMTRADE</h1>
        <p id="academy-subtitle" class="sub">مسیر آموزشی ۷ مرحله‌ای برای شروع کپی‌ترید</p>
      </header>
      <section class="academy-stages-wrap">
        <nav class="academy-stages list" id="academy-stages" aria-label="مراحل آموزشی">
          <div class="academy-loading">در حال بارگذاری مسیر آموزشی…</div>
        </nav>
      </section>
      <section class="academy-cta-section" id="academy-cta-section">
      <a class="academy-cta" id="academy-cta" href="/profile">
        <span class="academy-cta-arrow" id="academy-cta-arrow" aria-hidden="true">➜</span>
        <span id="academy-cta-text">شروع ثبت‌نام</span>
      </a>
      <p class="academy-footer-text" id="academy-footer-text">آماده ورود به مرحله بعدی هستید؟</p>
      </section>
    </section>
  </main>

  <div class="academy-modal s2" id="academy-modal" hidden>
    <section class="academy-modal-panel lesson-card" role="dialog" aria-modal="true" aria-labelledby="lesson-title">
      <header class="academy-modal-header lesson-top">
        <button class="academy-modal-close round-btn" id="academy-modal-close" type="button" data-close="1" aria-label="بازگشت به فهرست">←</button>
        <div class="lesson-position"><span class="academy-modal-stage" id="lesson-stage-label">مرحله ۱</span><div class="lesson-line"><i id="academy-lesson-progress"></i></div></div>
        <span aria-hidden="true"></span>
      </header>
      <div class="lesson-hero"><img id="academy-lesson-icon" src="/miniapp/p74/copytrade-academy/assets/book.webp" alt=""></div>
      <section class="lesson-intro"><h2 id="lesson-title"></h2></section>
      <section class="academy-modal-content lesson-panel" id="lesson-content"></section>
      <footer class="academy-modal-actions lesson-footer" id="lesson-actions"></footer>
    </section>
  </div>
  <div class="academy-live-status" id="academy-live-status" role="status" aria-live="polite"></div>
  <script defer src="./academy-home.js?v=MMTRADE_COPY_CLEAN_R1_20261126"></script>

<script defer src="/miniapp/p74/studio/bridge.js?v=BOT_PREVIEW_FIX_20261111_R1"></script>
