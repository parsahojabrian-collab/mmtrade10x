<body class="academy-page">
  <div class="academy-atmosphere" aria-hidden="true"></div>
  <main class="academy-shell">
    <header class="academy-header">
      <div class="academy-brand" aria-label="MATIN FUTURE 10X CHALLENGE">
        <svg class="academy-monogram" viewBox="0 0 60 44" role="img" aria-label="MF">
          <path d="M4 37 16 7 29 27 42 7 55 37 M29 27 42 7 56 7 M36 19 50 19" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="square" stroke-linejoin="miter"/>
        </svg>
        <img class="academy-logo" src="" alt="نشان اختصاصی MATIN FUTURE" hidden onerror="this.hidden=true">
        <div class="academy-brand-copy">
          <strong>MATIN FUTURE <span>|</span> <b>10X CHALLENGE</b></strong>
        </div>
      </div>
      <div class="academy-heading">
        <h1 id="academy-title">آکادمی متین فیوچر</h1>
        <p id="academy-subtitle">مسیر آموزشی ۷ مرحله‌ای برای شروع کپی‌ترید</p>
      </div>
    </header>

    <section class="academy-stages-wrap" aria-label="مراحل آموزشی">
      <div class="academy-stages" id="academy-stages">
        <div class="academy-loading">در حال بارگذاری مسیر آموزشی…</div>
      </div>
    </section>

    <section class="academy-cta-section" id="academy-cta-section">
      <a class="academy-cta" id="academy-cta" href="/profile">
        <span class="academy-cta-arrow" id="academy-cta-arrow" aria-hidden="true">➜</span>
        <span id="academy-cta-text">شروع ثبت‌نام</span>
      </a>
      <p class="academy-footer-text" id="academy-footer-text">آماده ورود به مرحله بعدی هستید؟</p>
      <p class="academy-risk-note" id="academy-risk-note">معاملات بازارهای مالی با ریسک همراه‌اند؛ سود تضمین‌شده نیست.</p>
    </section>
  </main>

  <div class="academy-modal" id="academy-modal" hidden>
    <button class="academy-modal-backdrop" type="button" data-close="1" aria-label="بستن"></button>
    <section class="academy-modal-panel" role="dialog" aria-modal="true" aria-labelledby="lesson-title">
      <div class="academy-modal-topline"></div>
      <header class="academy-modal-header">
        <div>
          <span class="academy-modal-stage" id="lesson-stage-label">مرحله ۱</span>
          <h2 id="lesson-title"></h2>
        </div>
        <button class="academy-modal-close" id="academy-modal-close" type="button" data-close="1" aria-label="بستن پنجره">×</button>
      </header>
      <div class="academy-modal-content" id="lesson-content"></div>
      <div class="academy-modal-actions" id="lesson-actions"></div>
    </section>
  </div>

  <div class="academy-live-status" id="academy-live-status" role="status" aria-live="polite"></div>
