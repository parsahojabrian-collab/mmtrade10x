<body class="uipromax-copytrade">
<div class="wrap" id="app">
  <section class="s1" id="course-index" aria-label="فهرست آموزش کپی‌ترید">
    <header class="hd">
      <img id="mmct-course-hero" class="bb" src="assets/bb.webp" alt="" aria-hidden="true">
      <img id="mmct-course-logo" class="logo" src="assets/logo.webp" alt="MMTrade 10X Challenge">
      <h1 id="mmct-course-heading" class="ttl glass">آموزش کپی‌ترید</h1>
      <p id="mmct-course-sub" class="sub">COPY TRADING ACADEMY</p>
    </header>
    <nav class="list" aria-label="هفت درس آموزش کپی‌ترید">
      <button id="mmct-index-card-0" class="row glass" type="button" data-k="0"><span class="in"><span class="ch" aria-hidden="true">‹</span><span class="t">کپی‌ترید چیست؟<small>و چگونه کار می‌کند؟</small></span><img id="mmct-index-icon-0" class="ic" src="assets/book.webp" alt=""></span></button>
      <button id="mmct-index-card-1" class="row glass" type="button" data-k="1"><span class="in"><span class="ch" aria-hidden="true">‹</span><span class="t">چطور معاملات یک تریدر را کپی کنیم؟</span><img id="mmct-index-icon-1" class="ic" src="assets/pair.webp" alt=""></span></button>
      <button id="mmct-index-card-2" class="row glass" type="button" data-k="2"><span class="in"><span class="ch" aria-hidden="true">‹</span><span class="t">تفاوت <bdi>Manual Trading</bdi> و <bdi>Copy Trading</bdi></span><img id="mmct-index-icon-2" class="ic" src="assets/swap.webp" alt=""></span></button>
      <button id="mmct-index-card-3" class="row glass" type="button" data-k="3"><span class="in"><span class="ch" aria-hidden="true">‹</span><span class="t">اتصال حساب معاملاتی به سیستم<small class="go">مشاهده مراحل اتصال</small></span><img id="mmct-index-icon-3" class="ic" src="assets/laptop.webp" alt=""></span></button>
      <button id="mmct-index-card-4" class="row glass" type="button" data-k="4"><span class="in"><span class="ch" aria-hidden="true">‹</span><span class="t">نحوه محاسبه سود و زیان</span><img id="mmct-index-icon-4" class="ic" src="assets/candles.webp" alt=""></span></button>
      <button id="mmct-index-card-5" class="row glass" type="button" data-k="5"><span class="in"><span class="ch" aria-hidden="true">‹</span><span class="t">مفهوم <bdi>Equity</bdi> و <bdi>Balance</bdi></span><img id="mmct-index-icon-5" class="ic" src="assets/tether.webp" alt=""></span></button>
      <button id="mmct-index-card-6" class="row glass" type="button" data-k="6"><span class="in"><span class="ch" aria-hidden="true">‹</span><span class="t">چطور عملکرد تریدر را بررسی کنیم؟</span><img id="mmct-index-icon-6" class="ic" src="assets/mag.webp" alt=""></span></button>
    </nav>
  </section>
  <section class="s2" id="D" hidden role="dialog" aria-modal="true" aria-label="محتوای درس" aria-live="polite"></section>
</div>
<div class="notice" id="notice" hidden role="dialog" aria-modal="true" aria-labelledby="notice-title">
  <div class="notice-card" dir="rtl">
    <h2 id="notice-title">مسیر اتصال حساب هنوز تنظیم نشده</h2>
    <p>دکمه آماده اتصال به صفحه رسمی مینی‌اپ است. قبل از انتشار، مسیر صحیح اتصال حساب را در فایل <code>config.js</code> وارد کنید.</p>
    <button type="button" id="close-notice">متوجه شدم</button>
  </div>
</div>
