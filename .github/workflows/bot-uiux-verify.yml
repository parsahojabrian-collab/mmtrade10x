name: Verify Bot UI UX

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/bot/**'
      - 'apps/api/public/admin.html'
      - 'tests/bot-ui.test.mjs'
      - '.github/workflows/bot-uiux-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install lockfile dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run db:generate
      - name: TypeScript build
        run: npm run build
      - name: Unit tests
        run: npm test
