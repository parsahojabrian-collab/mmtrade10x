name: Verify maintenance changes
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Generate Prisma client
        env:
          DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/ci
        run: npm run db:generate
      - name: TypeScript build
        run: npm run build
      - name: Unit tests
        run: npm test
