<section id="tenx-real-bot-manager" style="padding:20px;margin:20px 0;border:1px solid #8885;border-radius:14px">
<h2>مدیریت ربات تلگرام</h2>
<div id="tenx-bot-status">در حال دریافت وضعیت...</div>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin:14px 0">
<button type="button" onclick="tenxBotAction('start')">روشن کردن</button>
<button type="button" onclick="tenxBotAction('stop')">خاموش کردن</button>
<button type="button" onclick="tenxBotAction('restart')">ری‌استارت</button>
<button type="button" onclick="tenxBotStatus()">به‌روزرسانی وضعیت</button>
<button type="button" onclick="tenxBotLogs()">نمایش لاگ‌ها</button>
</div>
<pre id="tenx-bot-logs" style="white-space:pre-wrap;direction:ltr;text-align:left;max-height:400px;overflow:auto"></pre>
<div id="tenx-bot-message" role="status"></div>
</section>
<script>
(function(){
 const token=()=>sessionStorage.getItem('tenx_admin_token')||'';
 async function call(path,method='GET'){
  const r=await fetch(path,{method,headers:{'Authorization':'Bearer '+token(),'Content-Type':'application/json'}});
  const data=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(data.error||('HTTP '+r.status));
  return data;
 }
 window.tenxBotStatus=async function(){
  const el=document.getElementById('tenx-bot-status');
  el.textContent='در حال بررسی...';
  try{const d=await call('/admin/bot/status');el.textContent='وضعیت سرویس: '+d.status;}
  catch(e){el.textContent='خطا: '+e.message;}
 };
 window.tenxBotAction=async function(action){
  if(action==='stop'&&!confirm('ربات تلگرام خاموش شود؟'))return;
  const msg=document.getElementById('tenx-bot-message');
  msg.textContent='در حال اجرا...';
  try{await call('/admin/bot/'+action,'POST');msg.textContent='دستور '+action+' ارسال شد.';await tenxBotStatus();}
  catch(e){msg.textContent='عملیات ناموفق: '+e.message;}
 };
 window.tenxBotLogs=async function(){
  const el=document.getElementById('tenx-bot-logs');
  el.textContent='در حال دریافت لاگ...';
  try{const d=await call('/admin/bot/logs?lines=80');el.textContent=d.lines||'لاگی موجود نیست';}
  catch(e){el.textContent='خطا: '+e.message;}
 };
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',tenxBotStatus);
 else tenxBotStatus();
})();
</script>
